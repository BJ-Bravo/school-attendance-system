<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Froebel English School</title>

    <style>
        body {
            margin:0;
            font-family: Arial;
        }

        .container {
            display:flex;
            height:100vh;
        }

        /* LEFT SIDE */
        .left {
            width:50%;
            background:#0a2a5a;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
        }

        .school {
            font-size:40px;
            font-weight:bold;
        }

        .motto {
            margin-top:10px;
            font-size:20px;
        }

        /* RIGHT SIDE */
        .right {
            width:50%;

            background-image: url('/images/FroebelImage.jpeg');
            background-size: cover;
            background-position: center;

            display:flex;
            align-items:center;
            justify-content:center;

            /* Light overlay so form is visible */
            box-shadow: inset 0 0 0 2000px rgba(255,255,255,0.85);
        }

        .box {
            width:350px;
        }

        h2 {
            text-align:center;
        }

        input {
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        button {
            width:100%;
            padding:10px;
            background:#0a2a5a;
            color:white;
            border:none;
            cursor:pointer;
        }

        .link {
            text-align:center;
            margin-top:10px;
        }

        .error{
            color:red;
            text-align:center;
        }
    </style>

</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <div class="school">Froebel English School</div>
        <div class="motto">"KNOW THY SELF"</div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="box">

            <h2>Login</h2>

            <!-- SINGLE CORRECT FORM -->
            <form action="/login" method="post">

                <input name="email" placeholder="Email" required>

                <input name="password"
                       placeholder="Password"
                       type="password" required>

                <!-- ERROR MESSAGE -->
                <p class="error" th:text="${msg}"></p>

                <button>Login Now</button>

            </form>


        </div>

    </div>

    <script th:if="${param.error}">
        alert("Invalid Email or password");
    </script>

</div>

</body>
</html>
